[package]
name = "tank-engine"
version = "2.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clickhouse = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tonic = "0.12"
prost = "0.13"
hyper-util = "0.1"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"

[build-dependencies]
tonic-build = "0.12"
